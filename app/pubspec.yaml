name: anywhere_mobile
description: Anywhere Mobile - Android companion app for Anywhere Desktop (chat / file / notification interop via public relay).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # 中文本地化：没有它，TextField/SelectableText 长按弹出的
  # 系统菜单（复制/粘贴/全选/剪切）会是英文。
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # state + storage
  provider: ^6.1.2
  shared_preferences: ^2.3.2

  # networking
  web_socket_channel: ^3.0.1
  http: ^1.2.2

  # utils
  uuid: ^4.5.1
  # intl 版本交给 flutter_localizations 决定（两者必须匹配，否则运行时崩）。
  # DateFormat 的 API 在 0.19 / 0.20 完全一致，用 any 让 pub 解析到兼容版本。
  intl: any

  # notifications (local, shown when a push arrives over the relay)
  flutter_local_notifications: ^17.2.3

  # file picking & sharing
  file_picker: ^8.1.2
  share_plus: ^10.0.2
  path_provider: ^2.1.4
  open_filex: ^4.5.0

  # app version + in-app update
  package_info_plus: ^8.1.1

  # 读取手机型号名，用作设备显示名（自动填，不用用户手填）
  device_info_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
