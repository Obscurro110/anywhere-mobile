# ------------------------------------------------------------------
# 构建 Android APK
#
# 触发：推送到 main 且改动 app/、打 tag（v*）、或手动运行
# 产物：app-release.apk（作为 Artifact 上传；打 tag 时同时创建 Release）
# ------------------------------------------------------------------
name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold platform files (once)
        working-directory: app
        run: |
          # 生成缺失的 android/ 平台脚手架；不覆盖已有 lib/ 与配置
          flutter create . --org com.anywhere --project-name anywhere_mobile

      - name: Patch Android gradle (core library desugaring)
        working-directory: app
        run: python3 tools/patch_android.py

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos || true

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anywhere-mobile-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/app/outputs/flutter-apk/app-release.apk
