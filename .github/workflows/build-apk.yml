# ------------------------------------------------------------------
# 构建 Android APK，并自动发布到 GitHub Releases
#
# 触发：推送到 main 且改动 app/** 或 version.json、打 tag（v*）、或手动运行
#
# 版本号来源：仓库根 version.json  (versionName / versionCode)
#
# 产物：
#   - Actions Artifact：anywhere-mobile-apk
#   - GitHub Releases：
#       * main 分支  -> 滚动更新 Release（tag: apk-latest）
#           - anywhere-mobile.apk          (固定名，始终最新)
#           - anywhere-mobile-<ver>.apk    (带版本号，可固定引用)
#           - version.json                 (App 内"检查更新"读取它)
#       * v* 标签    -> 正式 Release（tag 用标签名）
# ------------------------------------------------------------------
name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "app/**"
      - "version.json"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write   # 需要写权限来创建 Release

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          VN=$(node -p "require('./version.json').versionName")
          VC=$(node -p "require('./version.json').versionCode")
          NOTES=$(node -p "require('./version.json').notes || ''")
          echo "name=$VN"   >> "$GITHUB_OUTPUT"
          echo "code=$VC"   >> "$GITHUB_OUTPUT"
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES"     >> "$GITHUB_OUTPUT"
          echo "EOF"        >> "$GITHUB_OUTPUT"
          echo "版本: $VN ($VC)"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold platform files (once)
        working-directory: app
        run: |
          # 生成缺失的 android/ 平台脚手架；不覆盖已有 lib/ 与配置
          flutter create . --org com.anywhere --project-name anywhere_mobile

      # 固定 release 签名：否则每次 CI 会用新生成的 debug key，
      # 导致新 APK 无法覆盖安装（"与已安装的应用签名不同"）。
      - name: Setup release signing
        id: signing
        working-directory: app
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，将使用 debug 签名（无法覆盖安装）"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KS_B64" | base64 -d > android/app/anywhere-release.p12
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=anywhere-release.p12
          storeType=PKCS12
          EOF
          ls -l android/app/anywhere-release.p12
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "已配置固定 release 签名"

      - name: Patch Android gradle (compileSdk + desugaring + signing)
        working-directory: app
        run: python3 tools/patch_android.py

      - name: Verify signing config
        working-directory: app
        run: |
          echo "--- key.properties ---"
          sed 's/=.*/=***/' android/key.properties
          # 只看真正参与构建的文件（.template 是 Flutter 的模板，不参与）
          GRADLE_FILE=""
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$f" ] && GRADLE_FILE="$f" && break
          done
          echo "--- 构建文件: $GRADLE_FILE ---"
          grep -n "signingConfig" "$GRADLE_FILE" || true
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            if grep -qE 'signingConfigs\.getByName\("debug"\)|signingConfigs\.debug|signingConfigs\["debug"\]' "$GRADLE_FILE"; then
              echo "::error::$GRADLE_FILE 仍指向 debug 签名，更新会失败"; exit 1
            fi
            if ! grep -q "signingConfigs" "$GRADLE_FILE"; then
              echo "::error::$GRADLE_FILE 没有 signingConfigs 块"; exit 1
            fi
            echo "✅ release 签名配置正确"
          fi

      - name: Sync version into pubspec
        working-directory: app
        run: |
          # 让 pubspec 与 version.json 保持一致（App 内通过 package_info 读取）
          python3 - "${{ steps.ver.outputs.name }}" "${{ steps.ver.outputs.code }}" <<'PY'
          import re, sys, pathlib
          name, code = sys.argv[1], sys.argv[2]
          p = pathlib.Path('pubspec.yaml')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'^version:.*$', f'version: {name}+{code}', s, flags=re.M)
          p.write_text(s, encoding='utf-8')
          print('pubspec version ->', name + '+' + code)
          PY
          grep '^version:' pubspec.yaml

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: |
          # 先跑一遍完整分析（可能有很多 info/warning，不拦）
          flutter analyze --no-fatal-infos --no-fatal-warnings || true
          # 再单独卡 error —— 有真正的编译错误就必须失败
          echo "--- 检查是否有 error ---"
          if flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | grep -E "^\s*error\s" ; then
            echo "::error::flutter analyze 发现 error，构建已中止"; exit 1
          fi
          echo "✅ 无 error"

      - name: Build release APK
        working-directory: app
        run: |
          flutter build apk --release \
            --build-name="${{ steps.ver.outputs.name }}" \
            --build-number="${{ steps.ver.outputs.code }}"

      - name: Rename APK + write version.json
        working-directory: app
        env:
          VN: ${{ steps.ver.outputs.name }}
          VC: ${{ steps.ver.outputs.code }}
          NOTES: ${{ steps.ver.outputs.notes }}
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/anywhere-mobile.apk
          cp build/app/outputs/flutter-apk/app-release.apk "out/anywhere-mobile-${VN}.apk"

          SHA=$(sha256sum out/anywhere-mobile.apk | cut -d' ' -f1)
          SIZE=$(stat -c%s out/anywhere-mobile.apk)
          REPO="${{ github.repository }}"
          URL="https://github.com/${REPO}/releases/download/apk-latest/anywhere-mobile.apk"

          VN="$VN" VC="$VC" NOTES="$NOTES" SHA="$SHA" SIZE="$SIZE" URL="$URL" \
          node -e '
            const fs = require("fs");
            const out = {
              platform: "android",
              versionName: process.env.VN,
              versionCode: Number(process.env.VC),
              notes: process.env.NOTES || "",
              url: process.env.URL,
              sha256: process.env.SHA,
              size: Number(process.env.SIZE),
              builtAt: new Date().toISOString(),
              commit: process.env.GITHUB_SHA || ""
            };
            fs.writeFileSync("out/version.json", JSON.stringify(out, null, 2));
            console.log(JSON.stringify(out, null, 2));
          '
          ls -lh out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anywhere-mobile-apk
          path: app/out/anywhere-mobile*.apk
          if-no-files-found: error

      # ---- 发布到 Releases：main 分支 -> 滚动更新（apk-latest）----
      # apk-latest 只作为「App 检查更新」的稳定地址，不占用 Latest 标记
      - name: Publish rolling Release (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Anywhere Mobile — latest APK"
          body: |
            🤖 滚动更新 Release（App 内「检查更新」读取这里的 version.json）

            当前版本：**v${{ steps.ver.outputs.name }}** (build ${{ steps.ver.outputs.code }})

            ${{ steps.ver.outputs.notes }}

            ---
            提交: `${{ github.sha }}`
          files: |
            app/out/anywhere-mobile.apk
            app/out/version.json
          make_latest: false
          draft: false
          prerelease: true

      # ---- 发布到 Releases：每个版本一条正式 Release（vX.Y.Z）----
      - name: Publish versioned Release (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Anywhere Mobile v${{ steps.ver.outputs.name }}
          body: |
            ## Anywhere Mobile v${{ steps.ver.outputs.name }} (build ${{ steps.ver.outputs.code }})

            ${{ steps.ver.outputs.notes }}

            ---
            ### 安装
            下载 `anywhere-mobile.apk` 安装即可。
            已装旧版的用户可在 App 内「设置 → 关于 → 检查更新」直接升级。

            提交: `${{ github.sha }}`
          files: |
            app/out/anywhere-mobile.apk
            app/out/anywhere-mobile-${{ steps.ver.outputs.name }}.apk
            app/out/version.json
          make_latest: true
          draft: false
          prerelease: false

      # ---- 发布到 Releases：v* 标签 -> 正式版本 ----
      - name: Publish tagged Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ${{ steps.ver.outputs.notes }}
          files: |
            app/out/anywhere-mobile.apk
            app/out/anywhere-mobile-${{ steps.ver.outputs.name }}.apk
            app/out/version.json
          draft: false
          prerelease: false
