# ------------------------------------------------------------------
# 构建 Android APK，并自动发布到 GitHub Releases
#
# 触发：推送到 main 且改动 app/、打 tag（v*）、或手动运行
#
# 产物：
#   - Actions Artifact：anywhere-mobile-apk
#   - GitHub Releases：
#       * main 分支  -> 滚动更新 Release（tag: apk-latest），始终是最新 APK
#       * v* 标签    -> 正式 Release（tag 用标签名）
# ------------------------------------------------------------------
name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write   # 需要写权限来创建 Release

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold platform files (once)
        working-directory: app
        run: |
          # 生成缺失的 android/ 平台脚手架；不覆盖已有 lib/ 与配置
          flutter create . --org com.anywhere --project-name anywhere_mobile

      - name: Patch Android gradle (compileSdk + core library desugaring)
        working-directory: app
        run: python3 tools/patch_android.py

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos || true

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Rename APK
        working-directory: app
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/anywhere-mobile.apk
          ls -lh out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anywhere-mobile-apk
          path: app/out/anywhere-mobile.apk
          if-no-files-found: error

      # ---- 发布到 Releases：main 分支 -> 滚动更新（apk-latest）----
      - name: Publish rolling Release (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Anywhere Mobile — latest APK"
          body: |
            🤖 由 GitHub Actions 自动构建

            提交: ${{ github.sha }}
            分支: ${{ github.ref_name }}
            时间: ${{ github.event.head_commit.timestamp }}

            下载 `anywhere-mobile.apk` 安装即可。
          files: app/out/anywhere-mobile.apk
          make_latest: true
          draft: false
          prerelease: false

      # ---- 发布到 Releases：v* 标签 -> 正式版本 ----
      - name: Publish tagged Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: app/out/anywhere-mobile.apk
          draft: false
          prerelease: false
