name: Build Desktop (Relay 绿色版)

# 自动构建带「手机互通」的 Anywhere Desktop 绿色版，
# 产物：anywhere-desktop-relay-win-x64.zip -> 发布到 Release "desktop-latest"
on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: '上游 ref（留空=默认分支最新）'
        required: false
        default: ''
  push:
    paths:
      - 'desktop-integration/**'
      - 'version.json'
      - '.github/workflows/build-desktop-relay.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: 检出本仓库（拿补丁、版本与文档）
        uses: actions/checkout@v4
        with:
          path: ours

      - name: 读取版本号
        id: ver
        shell: pwsh
        run: |
          $j = Get-Content "ours/version.json" -Raw | ConvertFrom-Json
          "name=$($j.versionName)" >> $env:GITHUB_OUTPUT
          "code=$($j.versionCode)" >> $env:GITHUB_OUTPUT
          Write-Host "版本: $($j.versionName) ($($j.versionCode))"

      - name: 关闭 CRLF 自动转换
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: 克隆上游 anywheredesktop（完整克隆，便于 3-way 合并）
        shell: pwsh
        run: |
          $ref = "${{ github.event.inputs.upstream_ref }}"
          git clone https://github.com/Komorebi-yaodong/anywheredesktop.git upstream
          if ($ref -ne '') {
            Set-Location upstream
            git fetch --all --tags
            git checkout $ref
          }
          Set-Location upstream
          git log --oneline -1
          # ⚠️ 必须直接输出字符串，不能用 Write-Host —— Write-Host 写的是
          # PowerShell 的「信息流」，**不会**被 >> 重定向到文件，导致
          # $env:GITHUB_ENV 根本没写入、后续 step 的 UPSTREAM_SHA 全是空。
          "UPSTREAM_SHA=$((git rev-parse HEAD).Trim())" >> $env:GITHUB_ENV

      - name: 应用互通补丁
        shell: pwsh
        run: |
          $patch = Resolve-Path "ours/desktop-integration/anywhere-desktop-relay.patch"
          Set-Location upstream
          Write-Host "==> 尝试 3-way 应用"
          git apply --3way --ignore-whitespace "$patch"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "==> 3-way 失败，改为按文件逐个应用"
            foreach ($f in @(
              'electron-builder.yml','main/index.js','package.json',
              'preload/main_preload.js','render/main/components/Setting.vue'
            )) {
              git apply --ignore-whitespace --include=$f "$patch"
              if ($LASTEXITCODE -ne 0) { throw "补丁应用失败: $f（上游改动较大，需要重新生成补丁）" }
              Write-Host "    [OK] $f"
            }
          }
          Write-Host "==> 补丁应用完成"

      - name: 注入版本号到 main/relay/version.js
        shell: pwsh
        run: |
          $dest = "upstream/main/relay/version.js"
          if (-not (Test-Path $dest)) { throw "找不到 $dest（补丁可能未包含 version.js）" }
          @(
            "/**",
            " * [anywhere-mobile] 手机互通版本号（由 CI 自动注入，勿手改）",
            " */",
            "export const RELAY_VERSION = '${{ steps.ver.outputs.name }}';",
            "export const RELAY_VERSION_CODE = ${{ steps.ver.outputs.code }};",
            ""
          ) | Set-Content $dest -Encoding UTF8
          Get-Content $dest

      - name: 校验关键文件存在
        shell: pwsh
        run: |
          Set-Location upstream
          $need = @('main/relay/index.js','main/relay/relay-client.js')
          foreach ($p in $need) { if (-not (Test-Path $p)) { throw "缺少 $p" } }
          $idx = Get-Content main/index.js -Raw
          if ($idx -notmatch 'startRelay') { throw "main/index.js 未注入 startRelay" }
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if (-not $pkg.dependencies.ws) { throw "package.json 缺少 ws 依赖" }
          Write-Host "校验通过：name=$($pkg.name)  ws=$($pkg.dependencies.ws)"

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: upstream/pnpm-lock.yaml

      - name: 安装依赖
        shell: pwsh
        run: |
          Set-Location upstream
          # 补丁改了 package.json（加了 ws），但没改 pnpm-lock.yaml，
          # 所以不能用 --frozen-lockfile，否则会报锁文件不一致。
          pnpm install --no-frozen-lockfile
        env:
          ELECTRON_GET_USE_PROXY: 0

      - name: 运行桌面回归测试
        shell: pwsh
        run: |
          Set-Location upstream
          pnpm run test:conversation-lease
          if ($LASTEXITCODE -ne 0) { throw "会话租约测试失败" }
          pnpm run test:relay-routing
          if ($LASTEXITCODE -ne 0) { throw "Relay 路由测试失败" }

      - name: 编译
        shell: pwsh
        run: |
          Set-Location upstream
          pnpm run build

      - name: 打包（绿色版 / unpacked）
        shell: pwsh
        run: |
          Set-Location upstream
          # CI 里网络通畅，仍复用本地 Electron 以免二次下载
          npx electron-builder --dir --publish never "-c.electronDist=node_modules/electron/dist" "-c.directories.output=dist-out"

      - name: 附加说明文档
        shell: pwsh
        run: |
          $dest = "upstream/dist-out/win-unpacked"
          if (Test-Path "ours/desktop-integration/新电脑安装说明.md") {
            Copy-Item "ours/desktop-integration/新电脑安装说明.md" "$dest/使用说明.md" -Force
          }
          @(
            "Anywhere Desktop (Relay) 绿色版",
            "================================",
            "版本号: ${{ steps.ver.outputs.name }} (build ${{ steps.ver.outputs.code }})",
            "上游提交: $env:UPSTREAM_SHA",
            "构建时间: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') UTC",
            "",
            "双击 anywhere-desktop-relay.exe 运行。",
            "首次运行请在 [设置 -> 手机互通] 里填写中继服务器地址 / Token / 用户ID。",
            "注意：Token 两端（手机与电脑）必须一致。"
          ) | Set-Content "$dest/版本信息.txt" -Encoding UTF8

          $sha = (Get-FileHash "upstream/dist-out/win-unpacked/anywhere-desktop-relay.exe" -Algorithm SHA256).Hash
          @{
            platform    = "windows"
            versionName = "${{ steps.ver.outputs.name }}"
            versionCode = [int]"${{ steps.ver.outputs.code }}"
            upstreamSha = $env:UPSTREAM_SHA
            sha256      = $sha.ToLower()
            builtAt     = (Get-Date -Format 'o')
            commit      = "${{ github.sha }}"
          } | ConvertTo-Json -Depth 4 | Set-Content "$dest/version.json" -Encoding UTF8
          Write-Host "已写入 version.json: ${{ steps.ver.outputs.name }}"

      - name: 压缩为 zip
        shell: pwsh
        run: |
          Set-Location upstream/dist-out/win-unpacked
          Compress-Archive -Path * -DestinationPath ../../../anywhere-desktop-relay-win-x64.zip -Force
          Set-Location ../../..
          Get-Item anywhere-desktop-relay-win-x64.zip | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: 发布到 Release (desktop-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: 'Desktop (Relay) v${{ steps.ver.outputs.name }} · latest'
          body: |
            ## Anywhere Desktop (Relay) 绿色版 v${{ steps.ver.outputs.name }} (build ${{ steps.ver.outputs.code }})

            - 上游提交：`${{ env.UPSTREAM_SHA }}`
            - 产物：`anywhere-desktop-relay-win-x64.zip`（Windows x64，免安装）

            ### 使用
            1. 解压到任意目录（如 `D:\AnywhereRelay`）
            2. 双击 `anywhere-desktop-relay.exe`
            3. 「设置 → 手机互通」填写：中继服务器地址 / Token / 用户 ID（需与手机端一致）

            > 包内 `版本信息.txt` 含版本号；`使用说明.md` 为完整文档。
            > 手机端「设置 → 关于」可看到电脑端版本号。
          prerelease: true
          files: anywhere-desktop-relay-win-x64.zip
          fail_on_unmatched_files: true
